name: DSH runtime release

on:
  workflow_dispatch:
  pull_request:
  release:
    types: [published]
  push:
    branches: [main]

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: '1.96.0'
  OPENPENCIL_DSH_RUNTIME_VERSION: '0.8.5-synapse.4'

jobs:
  runtime:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'runtime-v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          submodules: recursive
      - name: Validate release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: test "$RELEASE_TAG" = "runtime-v${OPENPENCIL_DSH_RUNTIME_VERSION}"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
          components: rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
      - name: Validate Node/WASM source policies
        run: |
          cargo fmt --all -- --check
          node --test --test-name-pattern='webpage|published release tag|validated assets|native build' scripts/check-dsh-runtime.test.mjs
          node scripts/check-dsh-runtime-dependencies.mjs
      - name: Install locked wasm-bindgen
        run: |
          version="$(awk '/^name = "wasm-bindgen"$/{found=1; next} found && /^version = /{gsub(/[" ]/,"",$3); print $3; exit}' Cargo.lock)"
          if ! command -v wasm-bindgen >/dev/null || [[ "$(wasm-bindgen --version)" != "wasm-bindgen $version" ]]; then
            cargo install wasm-bindgen-cli --version "$version" --locked --force
          fi
      - name: Build headless design WASM
        run: bash packages/dsh-node-runtime/build-engine.sh
      - name: Build embedded editor WASM
        run: bash packages/dsh-node-runtime/build-web.sh
      - name: Verify Node runtime and package whitelist
        run: node --test packages/dsh-node-runtime/*.test.mjs
      - name: Stage checksummed runtime
        run: node scripts/stage-dsh-runtime.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-design-pencil-runtime
          path: dist/*.tar.gz*
          if-no-files-found: error
  publish:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'runtime-v')
    needs: runtime
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dsh-design-pencil-runtime
          path: dist
      - name: Upload validated runtime assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.tar.gz*