name: Maintenance gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install locked lint dependencies
        run: |
          python -m pip install -r tools/requirements-lint.txt
          cd packages
          bun install --frozen-lockfile
      - name: Effective lines, v2 task records, knowledge freshness and changed JS
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_REF" || "$BASE_REF" =~ ^0+$ ]]; then
            BASE_REF="$(git rev-parse HEAD)"
          fi
          bash tools/check-maintenance.sh --base "$BASE_REF" --lint-js
          python -m unittest discover -s tools -p test_maintenance_entrypoints.py
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
